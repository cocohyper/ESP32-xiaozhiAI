services:
  xiaozhi-deepseek:
    build:
      context: .
    image: xiaozhi-deepseek:local
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "8000:8000"
      - "8003:8003"
    volumes:
      - type: bind
        source: ./data
        target: /opt/xiaozhi-esp32-server/data
        bind:
          create_host_path: false
      - type: bind
        source: ./models/SenseVoiceSmall/model.pt
        target: /opt/xiaozhi-esp32-server/models/SenseVoiceSmall/model.pt
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/xiaozhi/ota/', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
